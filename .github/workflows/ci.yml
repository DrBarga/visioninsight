name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install video runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1
      - name: Install dependencies
        run: |
          python -m pip install torch==2.10.0+cpu torchvision==0.25.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Check dependency environment
        run: python -m pip check
      - name: Run tests
        env:
          PYTHONPATH: backend
          VISIONINSIGHT_EMBEDDED_WORKER: "false"
        run: python -m pytest backend/tests -q
      - name: Compile Python sources
        run: python -m compileall -q backend/app
      - name: Check browser application syntax
        run: node --check frontend/app.js
