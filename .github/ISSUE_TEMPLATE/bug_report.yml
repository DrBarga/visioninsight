name: Bug report
description: Report a reproducible problem in VisionInsight.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link in SECURITY.md. Do not include credentials or personal video here."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or Git commit you tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, browser, and local or container setup.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include relevant errors with secrets and personal information removed.
    validations:
      required: true
