name: Feature request
description: Suggest an improvement to a recorded-video review workflow.
title: "Feature: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to accomplish, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: Describe the outcome and any alternatives you considered.
    validations:
      required: true
